# Deploys the built site to S3 + CloudFront (existing hosting).
# ENABLE ME: add AWS creds as repo secrets (AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY),
# set BUCKET below, then change 'on:' to master + workflow_dispatch.
name: Deploy
on:
  workflow_dispatch: {}
env:
  BUCKET: cesarramirez-io-site # TODO: set real bucket name
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: aws s3 sync dist s3://$BUCKET --delete
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      - run: aws cloudfront create-invalidation --distribution-id ${{ secrets.CF_DISTRIBUTION_ID }} --paths '/*'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
